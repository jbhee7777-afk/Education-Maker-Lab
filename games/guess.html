<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>나는 누구일까요</title>
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/games.css">
<style>
.view{width:min(46vh,90vw);aspect-ratio:1;border:5px solid var(--ink);border-radius:28px;background:var(--sky);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.view .art{width:86%;height:86%;transition:filter .6s,transform .6s}
.chosung{font-family:var(--f-display);font-size:clamp(3rem,10vw,8rem);letter-spacing:.15em;color:var(--berry2)}
</style>
</head>
<body class="stage">
<main class="board wrap" id="board"></main>
<div class="teams wrap" id="teams" style="margin-top:14px"></div>
<script src="../assets/art.js"></script>
<script src="../assets/core.js"></script>
<script>
(function(){
  const {$, shuffle} = XK, art = XArt.art, L = XArt.label;
  let g = XK.grade(), list = [], i = 0, step = 0;
  const teams = XK.teams($('#teams'));
  const MODE = {
    low: {name:'그림자 퀴즈', tip:'까만 그림자를 보고 누구인지 맞혀요. 보기 4개 중에 골라요.'},
    mid: {name:'확대 사진 퀴즈', tip:'아주 크게 확대된 그림! 「조금 더 보기」를 누를수록 점수가 줄어요.'},
    high:{name:'흐린 그림 + 초성 퀴즈', tip:'흐릿한 그림과 초성 힌트를 보고 이름을 외쳐요. 빨리 맞힐수록 높은 점수!'},
  };
  const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  const chosung = (s)=>[...s].map(ch=>{const c=ch.charCodeAt(0)-0xAC00; return c>=0&&c<11172?CHO[Math.floor(c/588)]:ch;}).join('');
  XK.topbar({title:'나는 누구일까요?', icon:'owl', grades:true, onGrade:(x)=>{g=x;start();}});
  function start(){ list = shuffle(XArt.NAMES).slice(0,12); i = 0; show(); }
  function show(){
    if(i>=list.length){ XK.sfx('win'); XK.confetti(); $('#board').innerHTML=`<div class="center"><div class="huge">12문제 끝!</div><button class="btn big red" id="ag">다시 하기</button></div>`; $('#ag').onclick=start; return; }
    const n = list[i], m = MODE[g]; step = 0;
    const opts = g==='low' ? shuffle([n, ...shuffle(XArt.NAMES.filter(x=>x!==n)).slice(0,3)]) : [];
    $('#board').innerHTML = `<div class="hud"><span class="tag">${m.name} · ${i+1}/${list.length}</span><span class="note" style="color:var(--ink2)">${m.tip}</span><span class="tag" id="pts"></span></div>
      <div class="center" style="gap:2vh"><div class="view" id="v">${art(n)}</div>
      ${g==='high'?`<div class="chosung" id="cs">${chosung(L(n))}</div>`:''}
      ${g==='low'?`<div class="choices" style="max-width:900px">${opts.map((o,k)=>`<button class="choice" data-o="${o}"><span class="k">${k+1}</span>${L(o)}</button>`).join('')}</div>`:''}
      <div class="row" id="act">${g!=='low'?`<button class="btn gold" id="more">조금 더 보기</button><button class="btn green" id="ans">정답 공개</button>`:''}</div></div>`;
    const img = $('#v .art');
    const apply = ()=>{
      if(g==='low') img.style.filter='brightness(0) opacity(.88)';
      if(g==='mid'){ const z=[4.2,2.8,1.8,1][step]; img.style.transform=`scale(${z})`; img.style.transformOrigin=`${30+Math.random()*40}% ${30+Math.random()*40}%`; }
      if(g==='high'){ img.style.filter=`blur(${[22,12,5,0][step]}px)`; }
      const p = Math.max(1,3-step); $('#pts').textContent = g==='low'?'맞히면 1점':`지금 맞히면 ${p}점`;
    };
    apply();
    if(g==='low') document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      const ok = b.dataset.o===n; img.style.filter='none';
      document.querySelectorAll('.choice').forEach(x=>{x.disabled=true; if(x.dataset.o===n) x.classList.add('right'); else if(x===b) x.classList.add('wrong');});
      ok?(XK.sfx('win'),XK.confetti(),teams.add(1)):XK.sfx('no'); next();
    });
    else {
      $('#more').onclick=()=>{ if(step<2){ step++; apply(); XK.sfx('pop'); } };
      $('#ans').onclick=()=>{ step=3; const p=Math.max(1,3-Math.min(step-1,2)); img.style.filter='none'; img.style.transform='scale(1)';
        const pts = Math.max(1, 3 - ($('#pts').dataset.s|0));
        $('#act').innerHTML = `<div class="huge" style="flex-basis:100%">${L(n)}</div><button class="btn green" id="y">맞혔어요</button><button class="btn" id="nn">못 맞혔어요</button>`;
        XK.sfx('bell');
        $('#y').onclick=()=>{ teams.add(lastPts); XK.sfx('win'); XK.confetti(); teams.next(); i++; show(); };
        $('#nn').onclick=()=>{ XK.sfx('no'); teams.next(); i++; show(); };
      };
      let lastPts = 3; const ob = $('#more').onclick; $('#more').onclick=()=>{ ob(); lastPts = Math.max(1,3-step); };
    }
  }
  function next(){ const a=$('#act'); a.innerHTML=`<button class="btn big green" id="nx">다음 →</button>`; $('#nx').onclick=()=>{teams.next(); i++; show();}; }
  start();
})();
</script>
</body>
</html>
