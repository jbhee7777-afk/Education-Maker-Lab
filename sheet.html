<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>크리스마스 활동지</title>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/sheet.css">
</head>
<body class="sheets">
<div id="viewer"></div>
<script src="assets/art.js"></script>
<script src="assets/core.js"></script>
<script src="assets/diff-data.js"></script>
<script src="assets/dots-hidden-data.js"></script>
<script src="assets/sheets-core.js"></script>
<script src="assets/sheets-a.js"></script>
<script src="assets/sheets-b.js"></script>
<script src="assets/viewer.js"></script>
<script>
(function(){
  const V = XViewer.mount(document.getElementById('viewer'));
  const go = ()=>{ const id = location.hash.slice(1); V.open(XViewer.find(id) ? id : SHEETS[0].id); scrollTo(0,0); };
  addEventListener('hashchange', go);
  window.__render = (sd, a)=>V.rerender(sd, a);
  go();
})();
</script>
</body>
</html>
