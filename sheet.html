<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>크리스마스 활동지</title>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/sheet.css">
</head>
<body class="sheets">
<div class="sbar wrap">
  <a class="btn sm" href="index.html">← 키트</a>
  <h1 id="st">활동지</h1>
  <div class="seg" id="gseg" role="group" aria-label="학년군"><button data-g="low">저학년</button><button data-g="mid">중학년</button><button data-g="high">고학년</button></div>
  <select id="other" aria-label="다른 활동지 고르기" class="btn sm" style="max-width:230px"></select>
  <button class="btn sm" id="b-new" hidden>새 문제로 바꾸기</button>
  <button class="btn sm" id="b-ans" hidden>정답 보기</button>
  <a class="btn sm gold" id="b-pdf" target="_blank" rel="noopener">PDF 열기</a>
  <button class="btn sm red" id="b-print">인쇄하기</button>
  <div class="info" id="info"></div>
</div>
<main id="pages" class="wrap"></main>
<script src="assets/art.js"></script>
<script src="assets/core.js"></script>
<script src="assets/diff-data.js"></script>
<script src="assets/sheets-core.js"></script>
<script src="assets/sheets-a.js"></script>
<script src="assets/sheets-b.js"></script>
<script>
(function(){
  const $=XK.$; let seed=1225, ans=false;
  function cur(){ const id=(location.hash||'').slice(1); return SHEETS.find(s=>s.id===id)||SHEETS[0]; }
  function fit(){ XK.$$('.pagebox').forEach(b=>{ const p=b.firstElementChild; p.style.transform=''; const k=Math.min(1,b.clientWidth/p.offsetWidth); p.style.transform=k<1?`scale(${k})`:''; b.style.height=(p.offsetHeight*k)+'px'; }); }
  const SUF = /-(low|mid|high)$/;
  const EXTRA = [{low:'cipher-mid',mid:'cipher-mid',high:'cipher-high'},{low:'letter-low',mid:'letter',high:'letter'}];
  function family(s){
    const m = {};
    if(SUF.test(s.id)){ const b = s.id.replace(SUF,''); SHEETS.forEach(x=>{ if(SUF.test(x.id) && x.id.replace(SUF,'')===b) x.grades.forEach(g=>{ if(!m[g]) m[g]=x.id; }); }); m[s.id.match(SUF)[1]] = s.id; }
    EXTRA.forEach(e=>{ if(Object.values(e).includes(s.id)) for(const g in e) if(!m[g]) m[g]=e[g]; });
    s.grades.forEach(g=>{ m[g]=m[g]||s.id; });
    return m;
  }
  let G = XK.store.get('grade','mid');
  function gradeUI(s, keep){
    const fam = family(s);
    if(!keep){ if(SUF.test(s.id)) G = s.id.match(SUF)[1]; else if(!fam[G]) G = s.grades[0]; }
    XK.$$('#gseg button').forEach(b=>{ const g=b.dataset.g; b.setAttribute('aria-pressed', g===G); b.style.opacity = fam[g] ? 1 : .45; b.title = fam[g] ? '' : '이 활동지는 이 학년용이 없어요'; });
    const groups = {}; SHEETS.filter(x=>x.grades.includes(G)).forEach(x=>{ (groups[x.cat]=groups[x.cat]||[]).push(x); });
    $('#other').innerHTML = `<option value="">${XK.GRADES[G]} 다른 활동지…</option>` + Object.keys(SH.CAT).filter(c=>groups[c]).map(c=>`<optgroup label="${SH.CAT[c]}">${groups[c].map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${x.title}</option>`).join('')}</optgroup>`).join('');
  }
  XK.$$('#gseg button').forEach(b=>b.onclick=()=>{
    const s = cur(), fam = family(s), g = b.dataset.g; G = g; XK.store.set('grade', g);
    if(fam[g] && fam[g]!==s.id){ location.hash = fam[g]; return; }
    gradeUI(s, true);
    if(!fam[g]){ $('#info').textContent = `「${s.title}」은(는) ${SH.gname(s.grades)}용이에요. 오른쪽 목록에서 ${XK.GRADES[g]} 활동지를 골라 보세요.`; $('#other').focus(); }
  });
  $('#other').onchange = (e)=>{ if(e.target.value) location.hash = e.target.value; };
  function render(){
    const s=cur(); document.title=s.title+' · 크리스마스 활동지'; $('#st').textContent=s.title;
    const pages=s.gen({r:XK.rng(seed), seed, ans});
    $('#pages').innerHTML=pages.map(p=>`<div class="pagebox ${/class="page land/.test(p)?'land':''}">${p}</div>`).join('');
    $('#b-pdf').href='print/'+encodeURIComponent(SH.pdfName(s, ans && s.answers));
    $('#b-new').hidden=!s.random; $('#b-ans').hidden=!s.answers; $('#b-ans').textContent=ans?'정답 숨기기':'정답 보기';
    $('#info').textContent=`${pages.length}쪽 · A4 · ${SH.gname(s.grades)}${s.paper?' · 추천 용지: '+s.paper:''} · 인쇄 버튼이 안 되면 「PDF 열기」로 인쇄하세요. (PDF는 기본 문제와 정답지가 들어 있어요)`;
    gradeUI(s);
    fit();
  }
  $('#b-new').onclick=()=>{ seed=Math.floor(Math.random()*1e9); render(); };
  $('#b-ans').onclick=()=>{ ans=!ans; render(); };
  $('#b-print').onclick=()=>{ window.print(); };
  addEventListener('hashchange',()=>{ans=false;render();scrollTo(0,0);}); addEventListener('resize',fit);
  window.__render=(sd,a)=>{seed=sd;ans=!!a;render();};
  render(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
