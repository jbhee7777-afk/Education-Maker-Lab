<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>꼬마 숲 대왕 트리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed 3D night village; HUD floats on the edges, panels are paper-cut cards. */
:root{
  color-scheme: dark;
  --night:#16223f; --night-2:#22335c; --snow:#eef3fb; --ink:#23304d;
  --berry:#e2504c; --pine:#2f7d5b; --gold:#ffd166; --card:#fff8ec;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--snow);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box}
#hud>*{pointer-events:auto}
.top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pill{background:rgba(22,34,63,.78);border:2px solid rgba(238,243,251,.25);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:17px;display:flex;gap:8px;align-items:center}
#prog{flex:1;min-width:150px;max-width:340px}
#bar{flex:1;height:12px;background:rgba(238,243,251,.18);border-radius:9px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pine),var(--gold));transition:width .4s}
button{font-family:var(--display);cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#music{margin-left:auto;font-size:17px}
#quest{font-size:15px;background:rgba(22,34,63,.6);border-radius:12px;padding:6px 12px;max-width:min(92vw,460px);align-self:flex-start;margin-top:6px}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
#joy{width:120px;height:120px;border-radius:50%;background:rgba(238,243,251,.12);border:2px solid rgba(238,243,251,.3);position:relative;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(238,243,251,.55)}
.acts{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#act{background:var(--berry);border:3px solid var(--snow);border-radius:18px;padding:12px 18px;font-size:19px;color:var(--snow);box-shadow:0 4px 0 rgba(0,0,0,.3)}
#jump{background:var(--night-2);border:2px solid rgba(238,243,251,.4);border-radius:50%;width:64px;height:64px;font-size:16px}
@media (hover:hover) and (pointer:fine){#joy,#jump{display:none}}
#bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--card);color:var(--ink);font-family:var(--display);font-size:15px;padding:5px 11px;border-radius:14px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--card);border-bottom:0}
.panel{background:var(--card);color:var(--ink);border-radius:22px;border:4px solid var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.25)}
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(92vw,560px);padding:14px 18px;box-sizing:border-box}
#dialog b{font-family:var(--display);font-size:18px;color:var(--berry)}
#dialog p{margin:6px 0 10px;font-size:17px;line-height:1.5;min-height:3em}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{background:var(--pine);color:var(--snow);border:0;border-radius:12px;padding:8px 16px;font-size:16px}
.btn.alt{background:#c9c2b4;color:var(--ink)}
.cover{position:fixed;inset:0;background:rgba(14,22,44,.82);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px;box-sizing:border-box;overflow:auto}
#start .panel{padding:22px;max-width:620px;width:100%;box-sizing:border-box;text-align:center}
h1{font-family:var(--display);font-size:clamp(28px,6vw,42px);margin:0 0 4px;color:var(--pine);text-wrap:balance}
#start p{margin:6px 0;font-size:16px;line-height:1.5}
.chars{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.ch{background:#fff;border:3px solid #d8cfbd;border-radius:16px;padding:10px;width:160px;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.35}
.ch em{display:block;font-size:40px;font-style:normal}
.ch strong{font-family:var(--display);font-size:19px;display:block}
.ch[aria-pressed=true]{border-color:var(--berry);background:#ffe9e3}
#go{background:var(--berry);font-size:21px;padding:11px 30px;border-radius:16px}
.keys{font-size:14px;opacity:.8}
#mini .panel{padding:12px;width:min(100%,680px);box-sizing:border-box}
#mhead{display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-size:18px;padding:0 4px 8px;flex-wrap:wrap}
#mc{width:100%;aspect-ratio:16/10;display:block;border-radius:14px;background:var(--night-2);touch-action:none}
#mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px;font-size:15px;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(20px,5vw,34px);color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.45);text-align:center;pointer-events:none;transition:opacity .5s;opacity:0;width:90vw}
@media (prefers-reduced-motion:reduce){#bar i,#toast{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bubbles"></div>
<div id="hud" hidden>
  <div>
    <div class="top">
      <div class="pill" title="가방">🎒 <span id="bag">0</span></div>
      <div class="pill" id="prog">🎄 <div id="bar"><i></i></div> <span id="cnt">0/40</span></div>
      <button class="pill" id="music">🔔 캐럴 켜짐</button>
    </div>
    <div id="quest"></div>
  </div>
  <div class="bottom">
    <div id="joy"><i></i></div>
    <div class="acts">
      <button id="act" hidden></button>
      <button id="jump">점프</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="dialog" class="panel" hidden><b id="dname"></b><p id="dtext"></p><div class="row" id="dbtns"></div></div>

<div id="mini" class="cover" hidden>
  <div class="panel">
    <div id="mhead"><span id="mtitle"></span><span id="mstat"></span></div>
    <canvas id="mc" width="640" height="400"></canvas>
    <div id="mfoot"><span id="mhelp"></span><button class="btn alt" id="mquit">그만하기</button></div>
  </div>
</div>

<div id="start" class="cover">
  <div class="panel">
    <h1>꼬마 숲 대왕 트리</h1>
    <p>눈 내리는 꼬마 숲을 돌아다니며 장식을 모아<br>광장의 대왕 트리를 꾸며 주세요!</p>
    <div class="chars" id="chars">
      <button class="ch" data-c="pong" aria-pressed="true"><em>🐧</em><strong>퐁이</strong>수줍음 많은 펭귄. 겁은 많지만 끝까지 해내요.</button>
      <button class="ch" data-c="rumi" aria-pressed="false"><em>🦊</em><strong>루미</strong>수다쟁이 여우. 뭐든 좋게 생각해요. 발이 빨라요.</button>
      <button class="ch" data-c="tori" aria-pressed="false"><em>🦌</em><strong>토리</strong>천방지축 사슴. 말보다 점프가 먼저! 높이 뛰어요.</button>
    </div>
    <button class="btn" id="go">모험 시작</button>
    <p class="keys">이동 WASD·방향키 / 시점 마우스 드래그 / 점프 Space / 말 걸기·꾸미기 E<br>휴대폰은 왼쪽 조이스틱과 화면 드래그</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), R=THREE, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];
const GOAL=40;

/* ---------- renderer / scene ---------- */
const renderer=new R.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
$('stage').appendChild(renderer.domElement);
const scene=new R.Scene(); scene.background=new R.Color(0x16223f); scene.fog=new R.Fog(0x16223f,45,130);
const cam=new R.PerspectiveCamera(55,1,.1,300);
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
scene.add(new R.HemisphereLight(0x8fa6e0,0x3a3658,.55));
const moonL=new R.DirectionalLight(0xcfdcff,.3);moonL.position.set(-30,50,20);scene.add(moonL);
const treeGlow=new R.PointLight(0xffc27a,.55,40);treeGlow.position.set(0,7,0);scene.add(treeGlow);

const M=(c,o)=>new R.MeshLambertMaterial(Object.assign({color:c},o||{}));
const B=(c)=>new R.MeshBasicMaterial({color:c});
function mesh(geo,mat,x,y,z,par){const m=new R.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);(par||scene).add(m);return m;}
const sph=(r,w,h)=>new R.SphereGeometry(r,w||16,h||12);

/* ground, sky */
mesh(new R.CircleGeometry(110,64),M(0x93a8d2),0,0,0).rotation.x=-Math.PI/2;
mesh(new R.CircleGeometry(9,40),M(0xd9c7a8),0,.02,0).rotation.x=-Math.PI/2;
mesh(sph(7),B(0xfff3c9),-70,60,-110);
{const g=new R.BufferGeometry(),p=[];for(let i=0;i<500;i++){const a=rnd(0,6.28),e=rnd(.15,1.4);p.push(Math.cos(a)*Math.cos(e)*200,Math.sin(e)*200,Math.sin(a)*Math.cos(e)*200);}
 g.setAttribute('position',new R.Float32BufferAttribute(p,3));scene.add(new R.Points(g,new R.PointsMaterial({color:0xffffff,size:1.3,fog:false})));}
/* snowfall */
const snowN=900,snowG=new R.BufferGeometry(),snowP=new Float32Array(snowN*3);
for(let i=0;i<snowN;i++){snowP[i*3]=rnd(-40,40);snowP[i*3+1]=rnd(0,30);snowP[i*3+2]=rnd(-40,40);}
snowG.setAttribute('position',new R.BufferAttribute(snowP,3));
const snow=new R.Points(snowG,new R.PointsMaterial({color:0xffffff,size:.16,transparent:true,opacity:.85}));scene.add(snow);

const colliders=[];
function solid(x,z,r){colliders.push({x,z,r});}

/* text / emoji sprites */
const texCache={};
function emojiTex(e){if(texCache[e])return texCache[e];const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
 x.font='96px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,64,70);
 return texCache[e]=new R.CanvasTexture(c);}
function emojiSprite(e,s){const sp=new R.Sprite(new R.SpriteMaterial({map:emojiTex(e),transparent:true}));sp.scale.set(s,s,s);return sp;}
function label(text,x,y,z){const c=document.createElement('canvas');c.width=512;c.height=112;const g=c.getContext('2d');
 g.fillStyle='#fff8ec';g.strokeStyle='#23304d';g.lineWidth=8;g.beginPath();g.rect(8,8,496,96);g.fill();g.stroke();
 g.fillStyle='#23304d';g.font='bold 52px "Jua","Malgun Gothic",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,58);
 const sp=new R.Sprite(new R.SpriteMaterial({map:new R.CanvasTexture(c),transparent:true}));sp.scale.set(6,1.3,1);sp.position.set(x,y,z);scene.add(sp);
 mesh(new R.CylinderGeometry(.08,.08,y,6),M(0x6b4a2f),x,y/2,z);return sp;}

/* scenery */
function pine(x,z,s){const g=new R.Group();g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);
 mesh(new R.CylinderGeometry(.25,.3,1,6),M(0x6b4a2f),0,.5,0,g);
 for(let i=0;i<3;i++){mesh(new R.ConeGeometry(1.6-i*.4,1.8,8),M(0x2a6b52),0,1.6+i*1.1,0,g);mesh(new R.ConeGeometry(1.0-i*.3,.7,8),M(0xe6eefb),0,2.25+i*1.1,0,g);}
 solid(x,z,.5*s);}
function house(x,z,col,rot){const g=new R.Group();g.position.set(x,0,z);g.rotation.y=rot||0;scene.add(g);
 mesh(new R.CylinderGeometry(2.4,2.6,2.4,14),M(col),0,1.2,0,g);mesh(new R.ConeGeometry(3.1,2.2,14),M(0xb5473f),0,3.5,0,g);
 mesh(new R.ConeGeometry(2.0,1.0,14),M(0xeef3fb),0,4.25,0,g);
 mesh(new R.BoxGeometry(.9,1.5,.2),M(0x6b4a2f),0,.75,2.5,g);mesh(new R.CircleGeometry(.45,12),B(0xffd98a),1.3,1.5,2.18,g).rotation.y=.5;
 solid(x,z,2.8);return g;}
function mound(x,z,r){mesh(sph(r,12,8),M(0xcfdcf2),x,-r*.55,z);}

/* forest ring + zones */
for(let i=0;i<70;i++){const a=i/70*6.283+rnd(-.03,.03),d=rnd(62,80);pine(Math.cos(a)*d,Math.sin(a)*d,rnd(1.6,2.8));}
for(let i=0;i<22;i++)pine(34+rnd(-11,11),-26+rnd(-11,11),rnd(1.1,1.9));     // 도깨비 숲
for(let i=0;i<14;i++)mound(rnd(-55,55),rnd(-55,55),rnd(1.5,3.5));
house(-12,-16,0xf2d9b0,.6);house(-18,10,0xcfe3d6,1.4);house(12,-18,0xe8cfe0,-.5);
// 열매 밭
mesh(new R.CircleGeometry(8,24),M(0x9fc5a2),-34,.03,-8).rotation.x=-Math.PI/2;
for(let i=0;i<18;i++){const a=rnd(0,6.28),d=rnd(1,7);mesh(sph(.35,8,6),M(0x3d8f63),-34+Math.cos(a)*d,.25,-8+Math.sin(a)*d);mesh(sph(.12,6,5),B(0xff6b6b),-34+Math.cos(a)*d,.6,-8+Math.sin(a)*d);}
// 핫초코 가게
{const g=new R.Group();g.position.set(28,0,24);g.rotation.y=-2.3;scene.add(g);
 mesh(new R.BoxGeometry(6,3,4),M(0x9c5b3b),0,1.5,0,g);mesh(new R.BoxGeometry(6.8,.5,5),M(0xeef3fb),0,3.25,0,g);
 mesh(new R.BoxGeometry(4,.3,1.2),M(0xe2504c),0,1.3,2.5,g);mesh(new R.CylinderGeometry(.4,.4,2,8),M(0x7a4a2a),2,4.2,-1,g);
 mesh(new R.BoxGeometry(3,1,.1),B(0xffd98a),0,2.2,2.03,g);solid(28,24,3.6);}
// 별 언덕
mesh(sph(9,20,10),M(0xc5d3ec),0,-5.5,-44);
// 연못
mesh(new R.CircleGeometry(7,28),new R.MeshLambertMaterial({color:0x7fb4e0,emissive:0x1b3a66}),-26,.04,28).rotation.x=-Math.PI/2;
// 모닥불
const fire=mesh(new R.ConeGeometry(.5,1.2,7),B(0xff9a3c),8,.7,8);for(let i=0;i<4;i++)mesh(new R.CylinderGeometry(.12,.12,1.4,5),M(0x5a3a22),8,.15,8).rotation.set(1.57,i*.8,0);
const fireL=new R.PointLight(0xff9a3c,1,14);fireL.position.set(8,1.5,8);scene.add(fireL);
label('반짝열매 밭',-34,4,-13);label('도깨비 숲',27,4.5,-17);label('핫초코 가게',25,5.5,20);label('별 언덕',0,5,-36);

/* ---------- the great tree ---------- */
const tree=new R.Group();scene.add(tree);
mesh(new R.CylinderGeometry(.9,1.2,2.4,10),M(0x6b4a2f),0,1.2,0,tree);
for(let k=0;k<5;k++){mesh(new R.ConeGeometry(5.4-k*.95,3.8,14),M(k%2?0x2f7d5b:0x286d50),0,3.6+k*2.3,0,tree);}
solid(0,0,1.6);
const env=y=>4.6*(1-(y-2.6)/11.6)+.35;
const slots=[];for(let i=0;i<GOAL;i++){const y=2.9+(i/GOAL)*10.2,a=i*2.399,r=env(y);slots.push(new R.Vector3(Math.cos(a)*r,y,Math.sin(a)*r));}
const bulbs=[];const bulbCols=[0xff5a5a,0xffd166,0x6fd3ff,0x9dff8a,0xff9be8];
for(let i=0;i<70;i++){const y=2.7+(i/70)*10.6,a=i*1.1,r=env(y)-.1;const b=mesh(sph(.13,6,5),B(bulbCols[i%5]),Math.cos(a)*r,y,Math.sin(a)*r,tree);b.visible=false;bulbs.push(b);}
const star=new R.Group();star.position.set(0,15.3,0);star.visible=false;tree.add(star);
mesh(new R.OctahedronGeometry(1.1),B(0xffe27a),0,0,0,star);mesh(new R.OctahedronGeometry(.8),B(0xfff6c9),0,0,0,star).rotation.set(.8,.8,0);
const starL=new R.PointLight(0xffe27a,0,60);starL.position.set(0,15,0);scene.add(starL);
let decorated=0;const flying=[];

/* ---------- critters ---------- */
function critter(o){const g=new R.Group(),b=M(o.body),w=M(o.belly||0xffffff),blk=M(0x1c1c22);
 const body=mesh(sph(.55),b,0,.55,0,g);body.scale.set(1,.92,.9);
 mesh(sph(.42),w,0,.5,.22,g).scale.set(.9,.9,.7);
 const head=new R.Group();head.position.set(0,1.22,0);g.add(head);
 mesh(sph(.6,20,14),b,0,0,0,head).scale.set(1.08,.92,1);
 if(o.face)mesh(sph(.42),w,0,-.1,.28,head).scale.set(1.1,.8,.8);
 mesh(sph(.065,8,6),blk,-.22,.06,.56,head);mesh(sph(.065,8,6),blk,.22,.06,.56,head);
 mesh(sph(.1,8,6),M(0xff9aa5),-.38,-.12,.46,head).scale.z=.4;mesh(sph(.1,8,6),M(0xff9aa5),.38,-.12,.46,head).scale.z=.4;
 const ears=[];
 if(o.ears==='point')for(const s of[-1,1]){const e=mesh(new R.ConeGeometry(.2,.45,8),b,s*.36,.55,0,head);e.rotation.z=-s*.25;mesh(new R.ConeGeometry(.1,.2,8),M(o.tip||0x3a2a22),s*.4,.72,0,head).rotation.z=-s*.25;ears.push(e);}
 if(o.ears==='round')for(const s of[-1,1])ears.push(mesh(sph(.17),b,s*.42,.45,0,head));
 if(o.antlers)for(const s of[-1,1]){const a=mesh(new R.CylinderGeometry(.04,.05,.5,5),M(0x7a5a3a),s*.25,.7,0,head);a.rotation.z=-s*.4;mesh(new R.CylinderGeometry(.03,.04,.25,5),M(0x7a5a3a),s*.42,.82,0,head).rotation.z=s*.6;
   const e=mesh(sph(.13),b,s*.55,.32,0,head);e.scale.set(1.5,.6,.5);ears.push(e);}
 if(o.beak)mesh(new R.ConeGeometry(.12,.28,8),M(0xffa53c),0,-.06,.66,head).rotation.x=1.57;
 else mesh(sph(.06,8,6),M(o.nose||0x1c1c22),0,-.06,.62,head);
 if(o.tuft)for(let i=0;i<3;i++)mesh(sph(.09,6,5),b,(i-1)*.1,.58+(i%2)*.06,0,head);
 const arms=[];for(const s of[-1,1]){const a=mesh(sph(.16,8,6),b,s*.55,.72,.08,g);a.scale.set(.8,1.3,.8);arms.push(a);}
 for(const s of[-1,1])mesh(sph(.17,8,6),M(o.feet||o.body),s*.24,.1,.12,g).scale.set(1,.6,1.4);
 if(o.tail==='fox'){const t=mesh(sph(.3),b,0,.55,-.62,g);t.scale.set(.8,.8,1.6);mesh(sph(.2),w,0,.6,-1.02,g);}

  poke(g,s){if(g.cd>0)return;g.cd=.22;g.dir=s;g.anim=.15;const c=g.en.filter(e=>e.s===s&&e.d<150).sort((a,b)=>a.d-b.d)[0];if(!c)return;
   if(c.k==='fairy'){g.score=Math.max(0,g.score-2);c.dead=true;pop(g,'요정이잖아! -2',320+s*c.d,230,'#ff8a8a');sfx('bad');}
   else{c.hp--;if(c.hp>0){c.d+=130;sfx('tick');}else{c.dead=true;const v=c.k==='big'?3:1;g.score+=v;pop(g,'+'+v,320+s*c.d,230);sfx('get');}}
   g.en=g.en.filter(e=>!e.dead);},
  down(g,x){this.poke(g,x<320?-1:1);},key(g,k){if(k==='ArrowLeft'||k==='KeyA')this.poke(g,-1);if(k==='ArrowRight'||k==='KeyD')this.poke(g,1);},
  draw(g){cx.fillStyle='#1d2c50';cx.fillRect(0,0,640,400);cx.fillStyle='#dfe9f7';cx.fillRect(0,300,640,100);
   for(const x of[40,110,530,600])em('🌲',x,250,90);
   cx.strokeStyle='rgba(255,255,255,.18)';cx.setLineDash([6,8]);for(const s of[-1,1]){cx.beginPath();cx.moveTo(320+s*150,215);cx.lineTo(320+s*150,315);cx.stroke();}cx.setLineDash([]);
   em(player.def.emoji,320,268,64);
   if(g.anim>0){cx.save();cx.translate(320+g.dir*70,270);cx.scale(g.dir,1);em('🧹',0,0,54);cx.restore();}
   for(const e of g.en){em(e.k==='fairy'?'🧚':e.k==='big'?'👹':'👻',320+e.s*e.d,e.k==='big'?262:270+Math.sin(g.el*9+e.d*.05)*6,e.k==='big'?70:48);}
   tx('❤️'.repeat(Math.max(0,g.hp)),20,28,22,'#fff','left');}},
 cocoa:{title:'☕ 핫초코 주문 외우기',help:'불러 준 순서대로 토핑을 누르세요. (숫자키 1~4)',time:0,th:[2,4,6],prize:'☕',
  T:['🍡','🍫','🍦','🌰'],N:['마시멜로','초코','크림','밤'],
  init(g){g.len=3;g.lives=2;this.round(g);},
  round(g){g.seq=[];for(let i=0;i<g.len;i++)g.seq.push(Math.random()*4|0);g.ph='show';g.pt=-.7;g.in=0;g.lit=-1;g.litT=0;g.last=-1;},
  update(g,dt){g.litT-=dt;if(g.ph==='show'){g.pt+=dt;const i=Math.floor(g.pt/.62);if(i>=g.seq.length)g.ph='input';else if(i>=0&&i!==g.last&&g.pt>=0){g.last=i;if(AC)bell([523,659,784,988][g.seq[i]],AC.currentTime,.2);}}
   if(g.ph==='wait'){g.pt-=dt;if(g.pt<=0){if(g.score>=6||g.lives<=0)g.over=true;else this.round(g);}}},
  press(g,i){if(g.ph!=='input')return;g.lit=i;g.litT=.2;if(AC)bell([523,659,784,988][i],AC.currentTime,.2);
   if(i!==g.seq[g.in]){g.lives--;g.shake=.3;pop(g,'손님이 삐졌어요…',320,150,'#ff8a8a');sfx('bad');g.ph='wait';g.pt=1.1;return;}
   g.in++;if(g.in>=g.seq.length){g.score++;g.len++;pop(g,'맛있어요! 👍',320,150,'#9dff8a');sfx('get');g.ph='wait';g.pt=1;}},
  down(g,x,y){if(y>270)this.press(g,Math.max(0,Math.min(3,Math.floor((x-40)/140))));},
  key(g,k){const i=['Digit1','Digit2','Digit3','Digit4'].indexOf(k);if(i>=0)this.press(g,i);},
  draw(g){cx.fillStyle='#5b3a2c';cx.fillRect(0,0,640,400);cx.fillStyle='#7a4f3a';cx.fillRect(0,250,640,150);
   em('☕',320,150,120);tx('🖤'.repeat(0)+'기회 '+'💗'.repeat(Math.max(0,g.lives)),20,28,20,'#fff','left');
   let cur=-1;if(g.ph==='show'){const i=Math.floor(g.pt/.62);if(i>=0&&i<g.seq.length&&(g.pt/.62-i)<.75)cur=g.seq[i];tx('두두: 잘 들어 봐요~',320,40,24,'#ffd166');if(cur>=0)tx(this.N[cur]+'!',320,236,28,'#fff');}
   else if(g.ph==='input')tx('내 차례! ('+g.in+'/'+g.seq.length+')',320,40,24,'#9dff8a');
   for(let i=0;i<4;i++){const on=cur===i||(g.lit===i&&g.litT>0);cx.fillStyle=on?'#ffd166':'#fff8ec';cx.beginPath();cx.rect(50+i*140,280,120,100);cx.fill();em(this.T[i],110+i*140,318,50);tx((i+1)+' '+this.N[i],110+i*140,364,17,'#23304d');}}},
 stars:{title:'🌠 별똥별 받기',help:'마우스·터치 또는 ← → 로 바구니를 움직이세요. 석탄은 피하기!',time:30,th:[14,24,34],prize:'🌠',
  init(g){g.bx=320;g.it=[];g.sp=.3;},
  update(g,dt){if(keys.ArrowLeft||keys.KeyA)g.bx-=420*dt;if(keys.ArrowRight||keys.KeyD)g.bx+=420*dt;g.bx=Math.max(40,Math.min(600,g.bx));
   g.sp-=dt;if(g.sp<=0){g.sp=Math.max(.24,.6-g.el*.011);const r=Math.random();g.it.push({x:rnd(40,600),y:-20,v:rnd(150,210)+g.el*4,k:r<.22?'coal':r<.34?'gift':'star'});}
   for(const i of g.it){i.y+=i.v*dt;if(i.y>325&&i.y<372&&Math.abs(i.x-g.bx)<50){i.dead=true;
     if(i.k==='coal'){g.score=Math.max(0,g.score-2);g.shake=.3;pop(g,'-2',i.x,300,'#ff8a8a');sfx('bad');}else{const v=i.k==='gift'?3:1;g.score+=v;pop(g,'+'+v,i.x,300);sfx('get');}}
    if(i.y>420)i.dead=true;}g.it=g.it.filter(i=>!i.dead);},
  down(g,x){g.bx=x;},move(g,x){g.bx=x;},
  draw(g){const gr=cx.createLinearGradient(0,0,0,400);gr.addColorStop(0,'#0f1a36');gr.addColorStop(1,'#33457a');cx.fillStyle=gr;cx.fillRect(0,0,640,400);
   cx.fillStyle='#dfe9f7';cx.beginPath();cx.ellipse(320,430,420,80,0,0,7);cx.fill();
   for(const i of g.it)em(i.k==='coal'?'🪨':i.k==='gift'?'🎁':'⭐',i.x,i.y,i.k==='gift'?44:38);
   em('🧺',g.bx,352,62);em(player.def.emoji,g.bx,318,30);}}
};
function miniStart(id){const G=GAMES[id];mode='mini';mini={G,id,el:0,score:0,over:false,done:false,pops:[],shake:0,intro:1.2};G.init(mini);
 $('mini').hidden=false;$('mtitle').textContent=G.title;$('mhelp').textContent=G.help;$('mquit').textContent='그만하기';$('act').hidden=true;}
function miniEnd(){const g=mini,G=g.G;g.done=true;const n=g.score>=G.th[2]?5:g.score>=G.th[1]?3:g.score>=G.th[0]?2:1;g.reward=n;
 for(let i=0;i<n;i++)bag.push(i===0?G.prize:pick(['⭐','🎁','🔔','🎀']));hud();sfx(n>1?'win':'get');$('mquit').textContent='숲으로 돌아가기';}
function miniClose(){const g=mini;$('mini').hidden=true;mini=null;mode='play';
 if(g&&g.done){say(player,pick(g.reward>1?player.def.got:player.def.sad),3);pals.forEach((p,i)=>setTimeout(()=>say(p,pick(g.reward>1?p.def.got:p.def.sad),2.5),400+i*500));toast('장식 '+g.reward+'개를 받았어요! 트리로 가져가요 🎄');}}
$('mquit').onclick=miniClose;
function mpos(e){const r=mc.getBoundingClientRect();return[(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*400/r.height];}
mc.addEventListener('pointerdown',e=>{if(!mini)return;if(mini.done){miniClose();return;}if(mini.intro>0)return;const[x,y]=mpos(e);mini.G.down(mini,x,y);});
mc.addEventListener('pointermove',e=>{if(mini&&!mini.done&&mini.G.move){const[x]=mpos(e);mini.G.move(mini,x);}});
function miniKey(k){if(!mini)return;if(mini.done){if(k==='Enter'||k==='KeyE'||k==='Escape')miniClose();return;}if(k==='Escape'){miniClose();return;}if(mini.intro<=0&&mini.G.key)mini.G.key(mini,k);}
function miniTick(dt){const g=mini,G=g.G;
 if(!g.done){if(g.intro>0)g.intro-=dt;else{g.el+=dt;G.update(g,dt);if(G.time&&g.el>=G.time)g.over=true;if(g.over)miniEnd();}}
 g.shake=Math.max(0,g.shake-dt);cx.save();if(g.shake>0)cx.translate(rnd(-5,5),rnd(-5,5));G.draw(g);drawPops(g,dt);cx.restore();
 $('mstat').textContent=(G.time?'⏱ '+Math.max(0,Math.ceil(G.time-g.el))+'초  ':'')+'점수 '+g.score;
 if(g.intro>0&&!g.done){cx.fillStyle='rgba(14,22,44,.6)';cx.fillRect(0,0,640,400);tx('준비~ 시작!',320,200,54,'#ffd166');}
 if(g.done){cx.fillStyle='rgba(14,22,44,.78)';cx.fillRect(0,0,640,400);tx(g.reward>=5?'완벽해요!':g.reward>=3?'잘했어요!':g.reward>=2?'좋아요!':'수고했어요!',320,120,50,'#ffd166');
  tx('점수 '+g.score,320,180,30);em(G.prize.repeat(1),320,240,54);tx('장식 '+g.reward+'개 획득!',320,300,28,'#9dff8a');tx('화면을 누르면 숲으로 돌아가요',320,350,18,'#cfd8ee');}}

/* ---------- start ---------- */
let chosen='pong';
$('chars').addEventListener('click',e=>{const b=e.target.closest('.ch');if(!b)return;chosen=b.dataset.c;document.querySelectorAll('.ch').forEach(x=>x.setAttribute('aria-pressed',x===b));});
const EMO={pong:'🐧',rumi:'🦊',tori:'🦌'};
function begin(){audioInit();if(AC)AC.resume();
 const order=[chosen].concat(Object.keys(CAST).filter(k=>k!==chosen));
 order.forEach((k,i)=>{const c=critter(CAST[k]);c.def=Object.assign({emoji:EMO[k]},CAST[k]);c.g.position.set(4+i*1.6,0,11+i);if(i===0)player=c;else pals.push(c);});
 NPCS.forEach(n=>{const c=critter(Object.assign({name:n.name},n.o));c.def=n;c.g.position.set(n.x,0,n.z);c.g.rotation.y=Math.atan2(-n.x,-n.z);solid(n.x,n.z,.9*(n.o.s||1));npcs.push(c);});
 $('start').hidden=true;$('hud').hidden=false;mode='play';hud();
 say(player,pick(player.def.lines),3);toast('대왕 트리를 꾸며 보자!');}
$('go').onclick=begin;

/* ---------- main loop ---------- */
function animate(c,t,dt){const mv=c.moving;c.ph+=dt*(mv?13:2.2);const hop=mv?Math.abs(Math.sin(c.ph))*.22:Math.sin(c.ph)*.02;
 c.g.position.y=c.y+hop*c.g.scale.y;c.head.rotation.z=mv?Math.sin(c.ph)*.08:Math.sin(c.ph*.5)*.03;
 c.arms[0].rotation.x=mv?Math.sin(c.ph)*.9:0;c.arms[1].rotation.x=mv?-Math.sin(c.ph)*.9:0;
 for(const e of c.ears)e.rotation.x=Math.sin(c.ph*1.3)*.08;
 if(c.bubT>0){c.bubT-=dt;if(c.bubT<=0)c.bub.hidden=true;}}
const v3=new R.Vector3();
function placeBubble(c){if(c.bub.hidden)return;v3.copy(c.g.position);v3.y+=c.h+.25;v3.project(cam);
 if(v3.z>1){c.bub.style.left='-999px';return;}c.bub.style.left=((v3.x+1)/2*innerWidth)+'px';c.bub.style.top=((1-v3.y)/2*innerHeight)+'px';}
function collide(p){for(const c of colliders){const dx=p.x-c.x,dz=p.z-c.z,d=Math.hypot(dx,dz),m=c.r+.5;if(d<m&&d>1e-4){p.x=c.x+dx/d*m;p.z=c.z+dz/d*m;}}
 const d=Math.hypot(p.x,p.z);if(d>58){p.x*=58/d;p.z*=58/d;}}
function turn(g,ang,dt){let d=ang-g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));g.rotation.y+=d*Math.min(1,dt*12);}
let last=performance.now(),chat=4,T=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0;}
 // ambience
 const sp=snow.geometry.attributes.position;for(let i=0;i<snowN;i++){let y=sp.getY(i)-dt*(2+(i%5)*.4);if(y<0)y=30;sp.setY(i,y);sp.setX(i,sp.getX(i)+Math.sin(T+i)*dt*.3);}sp.needsUpdate=true;
 fire.scale.y=1+Math.sin(T*11)*.15;fireL.intensity=.9+Math.sin(T*13)*.2;
 if(decorated>=10)for(let i=0;i<bulbs.length;i++){bulbs[i].visible=true;if(decorated>=25)bulbs[i].scale.setScalar(.7+.6*(Math.sin(T*4+i*1.7)>0));}
 if(star.visible){star.rotation.y+=dt*1.5;starL.intensity=.6+Math.sin(T*3)*.15;}
 for(const it of items){if(it.sp.visible){it.sp.position.y=1+Math.sin(T*2.2+it.ph)*.2;}else{it.cool-=dt;if(it.cool<=0)placeItem(it);}}
 // ornaments flying to the tree
 for(const f of flying){f.t+=dt*1.4;if(f.t<0)continue;const k=Math.min(1,f.t);f.sp.position.lerpVectors(f.from,f.to,k);f.sp.position.y+=Math.sin(k*Math.PI)*4;
  if(k>=1&&!f.done){f.done=true;decorated++;sfx('hang');hud();
   if(decorated===10){toast('✨ 전구에 불이 들어왔어요!');}if(decorated===25){toast('✨ 전구가 반짝반짝!');}
   if(decorated===GOAL){star.visible=true;treeGlow.intensity=.9;fwLeft=26;sfx('win');toast('🌟 대왕 트리 완성! 메리 크리스마스! 🌟');
    say(player,pick(player.def.got),5);pals.forEach(p=>say(p,pick(p.def.got),5));npcs.forEach(n=>say(n,'메리 크리스마스!',5));}}}
 for(let i=flying.length-1;i>=0;i--)if(flying[i].done)flying.splice(i,1);
 if(fwLeft>0){fwT-=dt;if(fwT<=0){fwT=.35;fwLeft--;firework();}}
 for(let i=fw.length-1;i>=0;i--){const f=fw[i];f.t+=dt;const p=f.pts.geometry.attributes.position;for(let j=0;j<f.v.length;j++){p.setXYZ(j,p.getX(j)+f.v[j].x*dt,p.getY(j)+f.v[j].y*dt-f.t*dt*3,p.getZ(j)+f.v[j].z*dt);}p.needsUpdate=true;f.pts.material.opacity=1-f.t/1.6;if(f.t>1.6){scene.remove(f.pts);fw.splice(i,1);}}

 if(player){const P=player.g.position;let ix=0,iy=0;
  if(mode==='play'){ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joyX;iy=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+joyY;}
  const l=Math.hypot(ix,iy);player.moving=l>.15;
  if(player.moving){const k=Math.min(1,l)/l,fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
   const dx=(fx*iy+rx*ix)*k,dz=(fz*iy+rz*ix)*k;P.x+=dx*player.def.speed*dt;P.z+=dz*player.def.speed*dt;turn(player.g,Math.atan2(dx,dz),dt);collide(P);}
  player.vy-=24*dt;player.y=Math.max(0,player.y+player.vy*dt);if(player.y===0)player.vy=0;
  animate(player,T,dt);
  // companions
  pals.forEach((c,i)=>{const back=1.9+i*1.5,side=i?-1.1:1.1,a=player.g.rotation.y;
   const tx_=P.x-Math.sin(a)*back+Math.cos(a)*side,tz=P.z-Math.cos(a)*back-Math.sin(a)*side,q=c.g.position,dx=tx_-q.x,dz=tz-q.z,d=Math.hypot(dx,dz);
   c.moving=d>.5;if(c.moving){const s=Math.min(d*3,c.def.speed*1.15)*dt;q.x+=dx/d*s;q.z+=dz/d*s;turn(c.g,Math.atan2(dx,dz),dt);collide(q);}
   if(d>30){q.x=tx_;q.z=tz;}animate(c,T,dt);});
  npcs.forEach(n=>{animate(n,T,dt);const d=Math.hypot(n.g.position.x-P.x,n.g.position.z-P.z);if(d<9)turn(n.g,Math.atan2(P.x-n.g.position.x,P.z-n.g.position.z),dt);
   if(d<12&&n.bubT<=0&&Math.random()<dt*.12)say(n,pick(n.def.bub));});
  // pickups
  if(mode==='play'){for(const it of items)if(it.sp.visible&&Math.hypot(it.sp.position.x-P.x,it.sp.position.z-P.z)<1.5&&player.y<2){it.sp.visible=false;it.cool=45;bag.push(it.e);sfx('get');hud();if(Math.random()<.6)say(player,pick(player.def.got),1.6);}
   chat-=dt;if(chat<=0){chat=rnd(5,9);const c=pick([player].concat(pals));say(c,pick(c.def.lines));}
   findNear();const a=$('act');if(near){a.hidden=false;a.textContent=near.t==='tree'?(bag.length?'🎄 트리 꾸미기 (E)':'🎄 대왕 트리 (E)'):'💬 말 걸기 (E)';}else a.hidden=true;}
  // camera
  const cp=Math.cos(camPitch);cam.position.set(P.x+Math.sin(camYaw)*cp*camDist,1.6+Math.sin(camPitch)*camDist,P.z+Math.cos(camYaw)*cp*camDist);cam.lookAt(P.x,1.6+player.y*.5,P.z);
  snow.position.set(P.x,0,P.z);
  [player].concat(pals,npcs).forEach(placeBubble);
 }else{cam.position.set(Math.sin(T*.12)*26,10,Math.cos(T*.12)*26);cam.lookAt(0,6,0);}
 renderer.render(scene,cam);
 if(mini)miniTick(dt);
}
requestAnimationFrame(frame);
window.__game={get s(){return{mode,decorated,bag:bag.length};},give(n){for(let i=0;i<n;i++)bag.push('⭐');hud();},miniStart,get mini(){return mini;},get player(){return player;}};
})();
